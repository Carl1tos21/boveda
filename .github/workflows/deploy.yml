name: Construir y desplegar

# Se ejecuta en cada push a main (y a mano desde la pestaña Actions).
#
# 1) Siempre construye dist/ y muestra el resultado en el log: sirve para
#    detectar errores de build sin depender de ningún hosting.
# 2) Publica el sitio en Cloudflare Pages (si están configurados los secretos
#    CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID).
#
# ¿Por qué Cloudflare Pages y no Netlify? Netlify pausa los despliegues al
# agotar los créditos del plan; Cloudflare Pages es gratis e ilimitado y
# respeta el archivo dist/_headers (con la CSP y las cabeceras de seguridad).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construir dist/
        run: python3 tools/build.py

      - name: Comprobar que no falta nada
        run: |
          test -f dist/index.html
          test -f dist/js/onedrive.js
          test -f dist/js/excel-quinquenios.js
          test -f dist/ms-auth.html
          test -f dist/_headers
          echo "OK: dist/ está completo"

      - name: Publicar en Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=boveda --branch=main

