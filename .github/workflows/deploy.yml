name: Construir y desplegar en GitHub Pages

# Se ejecuta en cada push a main (y a mano desde la pestaña Actions).
#
#   1) Construye dist/ con tools/build.py (Python) y comprueba que no falte nada.
#   2) Publica dist/ en GitHub Pages.
#
# Ventajas: gratis, despliegues ilimitados y sin cuentas nuevas.
# Aviso: GitHub Pages no admite archivos de cabeceras, así que el sitio
# publicado no llevará la CSP ni el resto de cabeceras de seguridad
# (dist/_headers se genera igual, pero GitHub Pages lo ignora).
#
# Requisito (una sola vez): en el repositorio, Settings → Pages →
# «Build and deployment» → Source: **GitHub Actions**.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construir dist/
        run: python3 tools/build.py

      - name: Comprobar que no falta nada
        run: |
          test -f dist/index.html
          test -f dist/js/onedrive.js
          test -f dist/js/excel-quinquenios.js
          test -f dist/ms-auth.html
          test -f dist/_headers
          echo "OK: dist/ está completo"

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


