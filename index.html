<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bóveda">
<meta name="description" content="Bóveda: gestor de documentos y datos cifrados, 100% local en tu dispositivo.">
<title>Bóveda · Mis Documentos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z' fill='%233b6cf6'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ======================= Pantalla de bloqueo ======================= -->
<div id="lock">
  <div class="lk">
    <div class="logo" id="lg"></div>
    <h2 id="lt" style="margin:0"></h2>
    <div class="mu" id="ls"></div>
    <button class="btn g" id="lgbtn" data-a="glogin" hidden></button>
    <div class="or" id="lor" hidden>o crea una bóveda nueva</div>
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="off">
    <input id="lp2" type="password" placeholder="Repite la contraseña" autocomplete="off" hidden>
    <button class="btn p" id="lb" style="justify-content:center"></button>
    <a id="lshowpw" data-a="showpw" hidden>Usar la contraseña</a>
    <div id="le" style="color:var(--dg);font-size:13px;min-height:18px"></div>
  </div>
</div>

<!-- ======================= Aplicación ======================= -->
<div id="app" hidden>
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="top" id="topbar"></header>
    <div class="wrap" id="view"></div>
  </div>
  <nav class="bot" id="bot"></nav>
</div>
<div class="status" id="status" hidden></div>

<div id="toast"></div>

<!-- Entradas de archivo ocultas -->
<input type="file" id="fi" hidden multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt">
<input type="file" id="cam" hidden accept="image/*" capture="environment">
<input type="file" id="gal" hidden multiple accept="image/*">
<input type="file" id="imp" hidden accept=".json,application/json">

<noscript><p style="padding:24px">Bóveda necesita JavaScript activado para cifrar y mostrar tus documentos.</p></noscript>

<!-- Motor de PDF (vendorizado para funcionar sin conexión y sin CDN) -->
<script src="vendor/jspdf.umd.min.js"></script>
<!-- SheetJS para leer archivos Excel (adelantos y quinquenios) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<!-- Módulos de la aplicación (scripts clásicos, en orden de dependencia) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/state.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/documents.js"></script>
<script src="js/scanner.js"></script>
<script src="js/info.js"></script>
<script src="js/settings.js"></script>
<script src="js/share.js"></script>
<script src="js/gdrive-config.js"></script>
<script src="js/gdrive.js"></script>
<script src="js/app.js"></script>
<script src="js/excel-quinquenios.js"></script>
</body>
</html>
